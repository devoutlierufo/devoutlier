<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAP Gerb - Conclusions Playlist</title>

  <style>
    body {
      margin: 0;
      background: #262626;
      color: #d2d2d2;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 92%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 30px;
      font-weight: 500;
      color: #dddddd;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      background: #1d1d1d;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #current-title {
      margin: 18px auto 6px;
      text-align: center;
      font-size: 18px;
      line-height: 1.4;
      color: #d0d0d0;
    }

    #current-count {
      text-align: center;
      font-size: 13px;
      color: #929292;
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .controls button {
      background: #383838;
      color: #d2d2d2;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 8px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #464646;
    }

    .playlist {
      border-top: 1px solid #444;
      max-height: 420px;
      overflow-y: auto;
    }

    .playlist-item {
      padding: 11px 12px;
      border-bottom: 1px solid #3d3d3d;
      border-left: 3px solid transparent;
      cursor: pointer;
      line-height: 1.3;
    }

    .playlist-item:hover {
      background: #303030;
    }

    .playlist-item.active {
      background: #3b3b3b;
      border-left-color: #9a9a9a;
    }

    .playlist-title {
      color: #d2d2d2;
      font-size: 14px;
    }

    .playlist-time {
      margin-top: 3px;
      color: #929292;
      font-size: 12px;
    }

    .playlist::-webkit-scrollbar {
      width: 8px;
    }

    .playlist::-webkit-scrollbar-track {
      background: #262626;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .page {
        width: 95%;
        padding-top: 25px;
      }

      h1 {
        font-size: 24px;
      }

      #current-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>UAP Gerb - Conclusions Playlist</h1>

    <div class="player-wrap">
      <div id="player"></div>
    </div>

    <div id="current-title"></div>
    <div id="current-count"></div>

    <div class="controls">
      <button id="previous-button">Previous</button>
      <button id="next-button">Next</button>
    </div>

    <div id="playlist-visible" class="playlist"></div>

  </div>

  <script src="playlist.js?v=3"></script>

  <script>
    let player;
    let currentIndex = 0;

    function buildVisiblePlaylist() {
      const container = document.getElementById('playlist-visible');

      playlist.forEach((item, index) => {
        const row = document.createElement('div');

        row.className = 'playlist-item';
        row.dataset.index = index;

        const title = document.createElement('div');
        title.className = 'playlist-title';
        title.textContent = item.title;

        const time = document.createElement('div');
        time.className = 'playlist-time';
        time.textContent = 'Conclusion — ' + item.timestamp;

        row.appendChild(title);
        row.appendChild(time);

        row.addEventListener('click', function () {
          playVideo(index);
        });

        container.appendChild(row);
      });
    }

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';

    const firstScriptTag = document.getElementsByTagName('script')[0];

    firstScriptTag.parentNode.insertBefore(
      tag,
      firstScriptTag
    );

    function onYouTubeIframeAPIReady() {
      if (!playlist || playlist.length === 0) {
        return;
      }

      const first = playlist[0];

      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: first.videoId,

        playerVars: {
          start: first.start,
          rel: 0
        },

        events: {
          onReady: function () {
            updateDisplay();
          },

          onStateChange: function (event) {
            if (event.data === YT.PlayerState.ENDED) {
              playNextVideo();
            }
          }
        }
      });
    }

    function playVideo(index) {
      currentIndex = index;

      const item = playlist[currentIndex];

      player.loadVideoById({
        videoId: item.videoId,
        startSeconds: item.start
      });

      updateDisplay();
    }

    function playNextVideo() {
      currentIndex++;

      if (currentIndex >= playlist.length) {
        currentIndex = 0;
      }

      playVideo(currentIndex);
    }

    function playPreviousVideo() {
      currentIndex--;

      if (currentIndex < 0) {
        currentIndex = playlist.length - 1;
      }

      playVideo(currentIndex);
    }

    function updateDisplay() {
      const item = playlist[currentIndex];

      document.getElementById('current-title').textContent =
        item.title;

      document.getElementById('current-count').textContent =
        (currentIndex + 1) + ' of ' + playlist.length;

      document
        .querySelectorAll('.playlist-item')
        .forEach(function (row) {
          row.classList.remove('active');
        });

      const active = document.querySelector(
        '.playlist-item[data-index="' +
        currentIndex +
        '"]'
      );

      if (active) {
        active.classList.add('active');
        keepActiveVisible(active);
      }
    }

    function keepActiveVisible(active) {
      const container = document.getElementById('playlist-visible');

      const containerRect = container.getBoundingClientRect();
      const activeRect = active.getBoundingClientRect();

      if (activeRect.top < containerRect.top) {
        container.scrollBy({
          top: activeRect.top - containerRect.top,
          behavior: 'smooth'
        });
      }

      if (activeRect.bottom > containerRect.bottom) {
        container.scrollBy({
          top: activeRect.bottom - containerRect.bottom,
          behavior: 'smooth'
        });
      }
    }

    document
      .getElementById('previous-button')
      .addEventListener('click', playPreviousVideo);

    document
      .getElementById('next-button')
      .addEventListener('click', playNextVideo);

    buildVisiblePlaylist();
  </script>

</body>
</html>
